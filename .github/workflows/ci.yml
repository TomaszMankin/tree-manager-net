name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: [self-hosted, windows]
    # Never run on fork PRs — protects the local self-hosted runner from untrusted code
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Restore
        shell: pwsh
        run: dotnet restore TreeManager.sln

      - name: Build
        shell: pwsh
        run: dotnet build TreeManager.sln --configuration Release --no-restore

      - name: L0 tests
        uses: ./.github/actions/run-test-tier
        with:
          tier: L0

      - name: L1 tests
        uses: ./.github/actions/run-test-tier
        with:
          tier: L1

      - name: Live SMTP test
        shell: pwsh
        env:
          SMTP_USERNAME: ${{ secrets.L1_EMAIL_RECIPIENT }}
          SMTP_APP_PASSWORD: ${{ secrets.L1_EMAIL_PASSWORD }}
          SMTP_RECIPIENT: ${{ secrets.L1_EMAIL_RECIPIENT }}
        run: |
          dotnet test TreeManager.sln `
            --configuration Release `
            --no-build `
            --filter "Tier=LiveSmtp" `
            --logger "trx;LogFileName=LiveSmtp.trx" `
            --results-directory test-results/LiveSmtp

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Publish (packaging validation)
        shell: pwsh
        run: |
          dotnet publish src/App/TreeManager.App/TreeManager.App.csproj `
            -c Release -o publish -r win-x64 --self-contained false

      - name: Velopack dry-run pack
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.0
          $version = ([xml](Get-Content src/App/TreeManager.App/TreeManager.App.csproj)).Project.PropertyGroup.Version
          vpk pack -u TreeManager -v $version -p publish --mainExe TreeManager.App.exe -o velopack-out
